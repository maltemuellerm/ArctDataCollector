# arct-proxy.conf — nginx snippet
# Include inside the openmetbuoy-arctic.com server { } block.
# Transparently forwards /arct-data/ requests to the ArctDataCollector
# site running on the same VPS (server_name 148.230.70.161).
# Because proxy_pass ends with /, nginx strips the /arct-data/ prefix:
#   /arct-data/               → http://127.0.0.1/
#   /arct-data/assets/js/app.js → http://127.0.0.1/assets/js/app.js
#   /arct-data/data/ships/X.csv → http://127.0.0.1/data/ships/X.csv

location /arct-data/ {
    proxy_pass         http://127.0.0.1/;
    proxy_http_version 1.1;

    # Route to the ArctDataCollector virtual host
    proxy_set_header   Host              148.230.70.161;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Rewrite any absolute Location: redirects from the upstream
    proxy_redirect     http://127.0.0.1/ /arct-data/;

    # Disable upstream compression so nginx can forward cleanly
    proxy_set_header   Accept-Encoding   "";

    # Force revalidation for HTML and JS so browsers never serve stale code
    add_header Cache-Control "no-cache" always;
}
