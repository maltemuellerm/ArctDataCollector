# rockblock-proxy.conf — nginx snippet
# Include inside the openmetbuoy-arctic.com server { } block to proxy
# RockBlock Web Services delivery webhooks to the Flask decoder on port 8080.
#
# Deploy to: /etc/nginx/snippets/rockblock-proxy.conf
# Then add to /etc/nginx/sites-available/openmetbuoy-arctic.com:
#   include /etc/nginx/snippets/rockblock-proxy.conf;

location /rockblock {
    proxy_pass         http://127.0.0.1:8080/rockblock;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
