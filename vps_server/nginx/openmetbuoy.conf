# openmetbuoy.conf — Nginx server block for openmetbuoy-arctic.com
#
# Deploy to: /etc/nginx/sites-available/openmetbuoy-arctic.com
# Enable:    ln -s /etc/nginx/sites-available/openmetbuoy-arctic.com \
#                  /etc/nginx/sites-enabled/openmetbuoy-arctic.com

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name openmetbuoy-arctic.com www.openmetbuoy-arctic.com;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name openmetbuoy-arctic.com www.openmetbuoy-arctic.com;

    ssl_certificate     /etc/letsencrypt/live/openmetbuoy-arctic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openmetbuoy-arctic.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/openmetbuoy-arctic.com;
    index index.html;

    # Static site — serve files directly; 404 on missing paths
    location / {
        try_files $uri $uri/ =404;
    }

    # GeoJSON and raw store: serve as static files written by the Flask decoder.
    # CORS headers allow external viewers (QGIS, custom web maps) to load them.
    location = /decoded_fixes.geojson {
        add_header Access-Control-Allow-Origin  "*"                             always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS"                  always;
        add_header Cache-Control               "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /master-decoded.json {
        add_header Access-Control-Allow-Origin  "*"                             always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS"                  always;
        add_header Cache-Control               "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Forward RockBLOCK Web Services delivery webhooks to the Flask decoder.
    include /etc/nginx/snippets/rockblock-proxy.conf;

    # Proxy /arct-data/ to the ArctDataCollector running on this VPS
    include /etc/nginx/snippets/arct-proxy.conf;
}
