# Canadian Arctic weather station sources via the MSC GeoMet SWOB-realtime API.
# Stations are identified by their WMO synop number.
# The API is queried using a ±0.3° bounding box around lat/lon + datetime filter.
# Wind speed is reported in km/h by the API and converted to m/s on ingest.
# Observations are fetched from CAMPAIGN_START = 2026-04-01 onward.

