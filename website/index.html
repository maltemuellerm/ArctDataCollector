<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arctic Ship Observations</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/download.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
    <script src="https://unpkg.com/proj4leaflet@1.0.2/src/proj4leaflet.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <h1>Arctic Observations</h1>
        <p>Arctic ship tracks, ice buoys &amp; NWP verification</p>
        <nav class="site-nav">
          <a href="index.html" class="active">Map &amp; Explorer</a>
          <a href="verification.html">NWP Verification</a>
          <a href="download.html">Download</a>
        </nav>
      </div>
    </header>

    <main class="layout">

      <!-- Loading / error message -->
      <p id="status" class="status-msg">Loading ship data&hellip;</p>

      <!-- Geographic map: all ship tracks -->
      <section class="card" id="map-section" style="display:none">
        <div id="map-container"></div>
        <!-- Time range slider -->
        <div id="time-slider-box">
          <div class="slider-labels">
            <span id="slider-start-label"></span>
            <span id="slider-range-label"></span>
            <span id="slider-end-label"></span>
          </div>
          <div class="dual-slider">
            <input type="range" id="slider-lo" min="0" max="1" step="1" value="0" />
            <input type="range" id="slider-hi" min="0" max="1" step="1" value="1" />
          </div>
        </div>
      </section>

      <!-- Click hint -->
      <p id="click-hint" class="click-hint">
        &#128270; Click any observation to view its time-series plot
      </p>

      <!-- Ship quick-select cards -->
      <div class="obs-group collapsed" id="grp-ships">
        <button class="obs-toggle" data-wrap="wrap-ships">
          Ships
          <span class="obs-badge" id="badge-ships"></span>
        </button>
        <div class="obs-body" id="wrap-ships">
          <div class="obs-body-inner">
            <div id="ship-cards" class="ship-cards"></div>
          </div>
        </div>
      </div>

      <!-- ArctSum 2025 buoy cards -->
      <div class="obs-group collapsed" id="grp-arctsum">
        <button class="obs-toggle" data-wrap="wrap-arctsum">
          ArctSum 2025 Buoys
          <span class="obs-badge" id="badge-arctsum"></span>
        </button>
        <div class="obs-body" id="wrap-arctsum">
          <div class="obs-body-inner">
            <div id="arctsum-cards" class="ship-cards compact"></div>
          </div>
        </div>
      </div>

      <!-- SvalMIZ 2026 buoy cards -->
      <div class="obs-group collapsed" id="grp-svalmiz">
        <button class="obs-toggle" data-wrap="wrap-svalmiz">
          SvalMIZ 2026 Buoys
          <span class="obs-badge" id="badge-svalmiz"></span>
        </button>
        <div class="obs-body" id="wrap-svalmiz">
          <div class="obs-body-inner">
            <div id="svalmiz-cards" class="ship-cards compact"></div>
          </div>
        </div>
      </div>

      <!-- IABP buoy cards -->
      <div class="obs-group collapsed" id="grp-iabp">
        <button class="obs-toggle" data-wrap="wrap-iabp">
          IABP Arctic Buoys
          <span class="obs-badge" id="badge-iabp"></span>
        </button>
        <div class="obs-body" id="wrap-iabp">
          <div class="obs-body-inner">
            <div id="iabp-cards" class="ship-cards compact"></div>
          </div>
        </div>
      </div>

      <!-- SIMBA ice buoy cards -->
      <div class="obs-group collapsed" id="grp-simba">
        <button class="obs-toggle" data-wrap="wrap-simba">
          SIMBA Ice Buoys
          <span class="obs-badge" id="badge-simba"></span>
        </button>
        <div class="obs-body" id="wrap-simba">
          <div class="obs-body-inner">
            <div id="buoy-cards" class="ship-cards"></div>
          </div>
        </div>
      </div>

      <!-- Thermistor chain buoy cards -->
      <div class="obs-group collapsed" id="grp-thermistor">
        <button class="obs-toggle" data-wrap="wrap-thermistor">
          Thermistor Chain Buoys
          <span class="obs-badge" id="badge-thermistor"></span>
        </button>
        <div class="obs-body" id="wrap-thermistor">
          <div class="obs-body-inner">
            <div id="thermistor-cards" class="ship-cards"></div>
          </div>
        </div>
      </div>

      <!-- ── Land-based Weather Stations ─────────────────── -->
      <div class="section-group collapsed" id="section-land">
        <button class="section-toggle">
          Land-based Weather Stations
          <span class="section-badge" id="badge-land"></span>
        </button>
        <div class="section-body">
          <div class="section-body-inner">

            <!-- Svalbard & Jan Mayen land-station cards -->
            <div class="obs-group collapsed" id="grp-svalbard">
              <button class="obs-toggle" data-wrap="wrap-svalbard">
                Svalbard &amp; Jan Mayen Stations
                <span class="obs-badge" id="badge-svalbard"></span>
              </button>
              <div class="obs-body" id="wrap-svalbard">
                <div class="obs-body-inner">
                  <div id="svalbard-cards" class="ship-cards compact"></div>
                </div>
              </div>
            </div>

            <!-- Northern Norway land-station cards -->
            <div class="obs-group collapsed" id="grp-north-norway">
              <button class="obs-toggle" data-wrap="wrap-north-norway">
                Northern Norway Stations
                <span class="obs-badge" id="badge-north-norway"></span>
              </button>
              <div class="obs-body" id="wrap-north-norway">
                <div class="obs-body-inner">
                  <div id="north-norway-cards" class="ship-cards compact"></div>
                </div>
              </div>
            </div>

            <!-- Greenland (DMI) land-station cards -->
            <div class="obs-group collapsed" id="grp-greenland">
              <button class="obs-toggle" data-wrap="wrap-greenland">
                Greenland Stations
                <span class="obs-badge" id="badge-greenland"></span>
              </button>
              <div class="obs-body" id="wrap-greenland">
                <div class="obs-body-inner">
                  <div id="greenland-cards" class="ship-cards compact"></div>
                </div>
              </div>
            </div>

            <!-- Canada (ECCC) land-station cards -->
            <div class="obs-group collapsed" id="grp-canada">
              <button class="obs-toggle" data-wrap="wrap-canada">
                Canadian Arctic Stations
                <span class="obs-badge" id="badge-canada"></span>
              </button>
              <div class="obs-body" id="wrap-canada">
                <div class="obs-body-inner">
                  <div id="canada-cards" class="ship-cards compact"></div>
                </div>
              </div>
            </div>

            <!-- Offshore platform cards -->
            <div class="obs-group collapsed" id="grp-offshore">
              <button class="obs-toggle" data-wrap="wrap-offshore">
                Offshore Platforms
                <span class="obs-badge" id="badge-offshore"></span>
              </button>
              <div class="obs-body" id="wrap-offshore">
                <div class="obs-body-inner">
                  <div id="offshore-cards" class="ship-cards compact"></div>
                </div>
              </div>
            </div>

            <!-- Alaska station cards -->
            <div class="obs-group collapsed" id="grp-alaska">
              <button class="obs-toggle" data-wrap="wrap-alaska">
                Alaska (NWS/ASOS)
                <span class="obs-badge" id="badge-alaska"></span>
              </button>
              <div class="obs-body" id="wrap-alaska">
                <div class="obs-body-inner">
                  <div id="alaska-cards" class="ship-cards compact"></div>
                </div>
              </div>
            </div>

            <!-- Russia / FJL / NZ station cards -->
            <div class="obs-group collapsed" id="grp-russia">
              <button class="obs-toggle" data-wrap="wrap-russia">
                Russia / Franz Josef Land / Novaya Zemlya
                <span class="obs-badge" id="badge-russia"></span>
              </button>
              <div class="obs-body" id="wrap-russia">
                <div class="obs-body-inner">
                  <div id="russia-cards" class="ship-cards compact"></div>
                </div>
              </div>
            </div>

            <!-- Iceland station cards -->
            <div class="obs-group collapsed" id="grp-iceland">
              <button class="obs-toggle" data-wrap="wrap-iceland">
                Iceland (IMO)
                <span class="obs-badge" id="badge-iceland"></span>
              </button>
              <div class="obs-body" id="wrap-iceland">
                <div class="obs-body-inner">
                  <div id="iceland-cards" class="ship-cards compact"></div>
                </div>
              </div>
            </div>

            <!-- Finland station cards -->
            <div class="obs-group collapsed" id="grp-finland">
              <button class="obs-toggle" data-wrap="wrap-finland">
                Finland (FMI)
                <span class="obs-badge" id="badge-finland"></span>
              </button>
              <div class="obs-body" id="wrap-finland">
                <div class="obs-body-inner">
                  <div id="finland-cards" class="ship-cards compact"></div>
                </div>
              </div>
            </div>

            <!-- Sweden station cards -->
            <div class="obs-group collapsed" id="grp-sweden">
              <button class="obs-toggle" data-wrap="wrap-sweden">
                Sweden (SMHI)
                <span class="obs-badge" id="badge-sweden"></span>
              </button>
              <div class="obs-body" id="wrap-sweden">
                <div class="obs-body-inner">
                  <div id="sweden-cards" class="ship-cards compact"></div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- MET Norway buoy cards -->
      <div class="obs-group collapsed" id="grp-norway-buoys">
        <button class="obs-toggle" data-wrap="wrap-norway-buoys">
          MET Norway Buoys
          <span class="obs-badge" id="badge-norway-buoys"></span>
        </button>
        <div class="obs-body" id="wrap-norway-buoys">
          <div class="obs-body-inner">
            <div id="norway-buoys-cards" class="ship-cards compact"></div>
          </div>
        </div>
      </div>

      <!-- Detail subfigure (appears on click) -->
      <section class="card detail-card" id="detail-section" style="display:none">
        <div class="detail-header">
          <span id="detail-title"></span>
          <span id="detail-meta"></span>
        </div>
        <div id="plot-container"></div>
      </section>

    </main>

    <script src="assets/js/csv-loader.js"></script>
    <script src="assets/js/map.js"></script>
    <script src="assets/js/plot.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
